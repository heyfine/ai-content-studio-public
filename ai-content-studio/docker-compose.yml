# AI Content Studio —— Docker Compose 编排
# 用法：复制 .env.docker.example 为 .env.docker 并填写，然后
#   docker compose --env-file .env.docker up -d --build
# 启动顺序：db（健康）→ migrate（db push + seed，一次性）→ app
# 详细说明见 ../docs/DEPLOYMENT.md「Docker 部署」
name: acs

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acs
      POSTGRES_USER: acs_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置 POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs_app -d acs"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    env_file: .env.docker
    environment:
      # 容器网络内连接 db 服务（host 固定为 db）
      DATABASE_URL: postgresql://acs_app:${POSTGRES_PASSWORD}@db:5432/acs?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://acs_app:${POSTGRES_PASSWORD}@db:5432/acs?schema=public
      # 容器内 host 非 localhost，Auth.js 需要显式信任
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    volumes:
      # 运行期图片库持久化（编辑器粘贴上传/图片库/转存）
      - uploads:/app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  dbdata:
  uploads:
